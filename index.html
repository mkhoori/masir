<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مسیر">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>مسیر — برنامه و پیشرفت من</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
:root{
  --bg:#f2f2f7; --surface:#ffffff; --fill:#f2f2f7; --fill2:#e9e9ee;
  --ink:#000000; --ink2:#3c3c43; --mute:#8a8a8e; --sep:rgba(60,60,67,.14);
  --accent:#3346d3; --accent-soft:#e8ebfc; --danger:#e5484d; --flame:#e8710a;
  --h0:#e7e7ec; --h1:#cdd3f7; --h2:#8e9bea; --h3:#3346d3;
  --r:14px;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#000000; --surface:#1c1c1e; --fill:#2c2c2e; --fill2:#3a3a3c;
    --ink:#ffffff; --ink2:#d1d1d6; --mute:#8d8d93; --sep:rgba(84,84,88,.45);
    --accent:#7083ff; --accent-soft:#1f2550; --danger:#ff6369; --flame:#ff9f0a;
    --h0:#232326; --h1:#2a3168; --h2:#4656c2; --h3:#7083ff;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"SF Arabic","Geeza Pro",Vazirmatn,Tahoma,system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);font-feature-settings:"tnum" 1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.wrap{max-width:540px;margin:0 auto;padding:8px 18px calc(104px + env(safe-area-inset-bottom))}

/* nav bar + large title */
.navbar{display:flex;align-items:center;justify-content:space-between;height:40px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--mute)}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--mute)}
.sync.ok i{background:#30a46c}.sync.busy i{background:var(--flame)}.sync.err i{background:var(--danger)}
.navbtn{background:none;border:0;color:var(--accent);font-size:15px;font-weight:600;padding:6px 0}
.title{font-size:32px;font-weight:800;letter-spacing:-.6px;line-height:1.2;margin:2px 0 0}
.subtitle{color:var(--mute);font-size:15px;margin:2px 0 18px}

/* grouped lists */
.sec{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute);margin:22px 4px 7px}
.sec .sw{width:8px;height:8px;border-radius:50%;background:var(--c)}
.sec .end{margin-inline-start:auto;font-weight:600}
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.rowi{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 16px;background:none;border:0;text-align:right;position:relative}
.rowi+.rowi::before{content:"";position:absolute;top:0;left:0;right:var(--inset,16px);height:1px;background:var(--sep);transform:scaleY(.6)}
.rowi .main{flex:1;min-width:0;display:flex;flex-direction:column}
.rowi .t{font-size:16px;font-weight:500;line-height:1.4}
.rowi .s{font-size:13px;color:var(--mute);margin-top:1px}
.rowi .val{color:var(--mute);font-size:15px}
.rowi .val b{color:var(--ink);font-weight:600}
.chev{width:8px;height:14px;flex:none;color:var(--fill2)}
.chev path{stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.rowi.link{color:var(--accent);font-weight:500}
.rowi.danger{color:var(--danger);justify-content:center;font-weight:500}
.foot{font-size:12.5px;color:var(--mute);margin:8px 16px 0;line-height:1.7}

/* week strip — the signature element */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--surface);border-radius:var(--r);padding:10px 6px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;padding:6px 0 4px;border-radius:12px;color:var(--ink)}
.wd .l{font-size:11.5px;color:var(--mute)}
.wd .mr{position:relative;width:34px;height:34px}
.wd .mr svg{width:34px;height:34px;transform:rotate(-90deg)}
.wd .mr .bgc{fill:none;stroke:var(--fill);stroke-width:3.2}
.wd .mr .fgc{fill:none;stroke:var(--accent);stroke-width:3.2;stroke-linecap:round;transition:stroke-dashoffset .45s ease}
.wd .mr span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600}
.wd.full .mr span{color:var(--accent)}
.wd.sel{background:var(--accent-soft)}
.wd.today .l{color:var(--accent);font-weight:700}
.wd.future{opacity:.45}
.wd.pre{opacity:.25}
.weeknav{display:flex;justify-content:space-between;align-items:center;margin:0 4px 8px;font-size:13px;color:var(--mute)}
.weeknav button{background:none;border:0;color:var(--accent);font-size:13px;font-weight:600;padding:4px 0}
.weeknav button:disabled{visibility:hidden}

/* day summary */
.summary{background:var(--surface);border-radius:var(--r);padding:16px;margin-top:12px}
.sumtop{display:flex;align-items:baseline;gap:8px}
.big{font-size:34px;font-weight:800;letter-spacing:-.5px;line-height:1}
.sumtop .of{color:var(--mute);font-size:14px}
.streak{margin-inline-start:auto;display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:var(--flame)}
.streak svg{width:14px;height:14px;fill:currentColor}
.track{height:6px;border-radius:99px;background:var(--fill);overflow:hidden;margin:12px 0 10px}
.track i{display:block;height:100%;border-radius:99px;background:var(--c,var(--accent));transition:width .45s ease}
.sumrow{display:flex;justify-content:space-between;font-size:13px;color:var(--mute)}

/* task rows */
.task{cursor:pointer}
.task:active{background:var(--fill)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--fill2);flex:none;display:flex;align-items:center;justify-content:center;transition:background .18s,border-color .18s}
.chk svg{width:14px;height:14px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.task.done .chk{background:var(--c);border-color:var(--c)}
.task.done .chk svg{opacity:1}
.task.done .t{color:var(--mute)}
.task.pop .chk{animation:pop .32s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}
.task.locked{cursor:default}
.task.locked .chk{border-style:dashed}

.empty{background:var(--surface);border-radius:var(--r);padding:30px 20px;text-align:center;margin-top:12px}
.empty b{display:block;font-size:16px;margin-bottom:2px}
.empty span{color:var(--mute);font-size:14px}

.hint{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:var(--r);padding:12px 14px;margin-top:12px;font-size:13.5px;color:var(--ink2)}
.hint button{background:none;border:0;color:var(--accent);font-weight:700;font-size:13.5px;padding:0;white-space:nowrap}

/* stats */
.statgrid{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:var(--r);overflow:hidden}
.st{padding:14px 16px;position:relative}
.st:nth-child(2n)::before{content:"";position:absolute;right:0;top:14px;bottom:14px;width:1px;background:var(--sep)}
.st:nth-child(n+3)::after{content:"";position:absolute;top:0;left:16px;right:16px;height:1px;background:var(--sep)}
.st small{display:block;color:var(--mute);font-size:12.5px}
.st b{font-size:26px;font-weight:800;letter-spacing:-.4px}
.st em{font-style:normal;color:var(--mute);font-size:13px;margin-inline-start:4px}
.delta{display:block;font-size:12px;font-weight:600;color:var(--mute)}
.delta.up{color:#30a46c}.delta.down{color:var(--flame)}

/* chart */
.chart{background:var(--surface);border-radius:var(--r);padding:16px 14px 12px}
.bars{display:flex;align-items:flex-end;gap:10px;height:132px}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px}
.bar .col{width:100%;max-width:26px;border-radius:7px;background:var(--h1);min-height:4px;transition:height .45s ease}
.bar.cur .col{background:var(--accent)}
.bar .v{font-size:11px;color:var(--mute);min-height:16px}
.bar.cur .v{color:var(--accent);font-weight:700}
.xlab{display:flex;gap:10px;margin-top:6px}
.xlab span{flex:1;text-align:center;font-size:10.5px;color:var(--mute);white-space:nowrap}

/* heatmap */
.heat{display:flex;gap:8px;background:var(--surface);border-radius:var(--r);padding:14px}
.hlab{display:grid;grid-template-rows:repeat(7,16px);gap:4px;font-size:10px;color:var(--mute);text-align:center;width:14px}
.hgrid{flex:1;display:grid;grid-template-rows:repeat(7,16px);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.hc{border-radius:4px;background:var(--h0)}
.hc.l1{background:var(--h1)}.hc.l2{background:var(--h2)}.hc.l3{background:var(--h3)}
.hc.na{background:transparent}
.hc.pre{opacity:.45}
.hc.tdy{box-shadow:0 0 0 1.5px var(--surface),0 0 0 3px var(--ink)}
.hlab span{display:flex;align-items:center;justify-content:center}

/* goal progress rows */
.gbadge{width:34px;height:34px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;font-size:17px;background:color-mix(in srgb,var(--c) 14%,transparent)}
.gp .track{margin:7px 0 0;height:5px}
.dots7{display:flex;gap:4px;margin-top:8px}
.dots7 i{flex:1;height:5px;border-radius:99px;background:var(--fill)}
.dots7 i.full{background:var(--c)}
.dots7 i.part{background:color-mix(in srgb,var(--c) 40%,var(--fill))}
.dots7 i.off{background:transparent;border:1px dashed var(--fill2)}

.days{display:inline-flex;gap:2px;margin-top:3px}
.days span{font-size:11px;width:17px;text-align:center;color:var(--fill2);font-weight:600}
.days span.on{color:var(--c)}

/* review */
.seg{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:var(--r);padding:6px}
.seg button{width:40px;height:36px;border-radius:10px;border:0;background:none;color:var(--accent);font-size:20px}
.seg button:disabled{color:var(--fill2)}
.seg .mid{text-align:center}
.seg .mid b{display:block;font-size:15px}
.seg .mid small{color:var(--mute);font-size:12px}
.qa{background:var(--surface);border-radius:var(--r);padding:14px 16px}
.qa+.qa{margin-top:10px}
.qa label{display:block;font-weight:600;font-size:15px;margin-bottom:6px}
.qa textarea{width:100%;border:0;background:none;padding:0;min-height:64px;resize:none;font-size:16px;outline:none;color:var(--ink);line-height:1.7}
.qa textarea::placeholder{color:var(--mute)}

/* tab bar */
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:5;background:color-mix(in srgb,var(--surface) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);padding:6px 8px calc(4px + env(safe-area-inset-bottom))}
.tabs .in{display:flex;max-width:540px;margin:0 auto}
.tabs button{flex:1;background:none;border:0;color:var(--mute);font-size:10.5px;font-weight:500;display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0}
.tabs svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tabs button.on{color:var(--accent)}
.tabs button.on svg{stroke-width:2.1}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;visibility:hidden}
#sheet.open{visibility:visible}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.32);opacity:0;transition:opacity .25s}
#sheet.open .sheet-bg{opacity:1}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;background:var(--bg);border-radius:14px 14px 0 0;padding:6px 18px calc(22px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1)}
#sheet.open .sheet-panel{transform:none}
.grab{width:36px;height:5px;border-radius:99px;background:var(--fill2);margin:0 auto 6px}
.sheethead{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:44px;margin-bottom:8px}
.sheethead h3{margin:0;font-size:16px;font-weight:700}
.sheethead .navbtn:first-child{justify-self:start;font-weight:400}
.sheethead .navbtn:last-child{justify-self:end}
.sheethead .navbtn:disabled{color:var(--fill2)}
.input{width:100%;border:0;background:none;padding:0;font-size:16px;outline:none;color:var(--ink)}
.input::placeholder{color:var(--mute)}
.fieldrow{min-height:50px}
.fieldrow .lbl{color:var(--ink);font-size:16px;flex:none}
.fieldrow select,.fieldrow input[type=number]{border:0;background:none;color:var(--mute);font-size:16px;text-align:left;outline:none;direction:rtl;max-width:60%}
.fieldrow input[type=number]{width:70px;text-align:center;color:var(--ink);background:var(--fill);border-radius:8px;padding:4px 0}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:32px;height:32px;border-radius:8px;border:0;background:var(--fill);color:var(--ink);font-size:18px}
.daypick{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px 16px}
.daypick button{aspect-ratio:1;border-radius:50%;border:0;background:var(--fill);font-weight:600;font-size:14px;color:var(--ink2)}
.daypick button.on{background:var(--accent);color:#fff}
.chips{display:flex;gap:6px;padding:0 16px 14px;flex-wrap:wrap}
.chips button{border:0;background:var(--fill);border-radius:99px;padding:5px 12px;font-size:13px;color:var(--ink2)}
.swatches{display:flex;gap:12px;padding:14px 16px}
.swatches button{width:30px;height:30px;border-radius:50%;border:0;box-shadow:0 0 0 2px var(--surface)}
.swatches button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;padding:10px 12px}
.emojis button{aspect-ratio:1;border:0;border-radius:10px;background:none;font-size:20px}
.emojis button.on{background:var(--fill)}
.mono{direction:ltr;font-size:12px;font-family:ui-monospace,Menlo,monospace;min-height:150px;width:100%;border:0;border-radius:var(--r);background:var(--surface);padding:12px;outline:none;color:var(--ink)}
.alert{text-align:center;padding:10px 4px 0}
.alert b{display:block;font-size:17px;margin-bottom:4px}
.alert p{color:var(--mute);font-size:14px;margin:0 0 18px}
.alert .group .rowi{justify-content:center;font-weight:600}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translate(-50%,12px);background:color-mix(in srgb,var(--ink) 88%,transparent);color:var(--bg);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:9px 16px;border-radius:99px;font-size:14px;font-weight:500;opacity:0;pointer-events:none;transition:all .25s;z-index:30;white-space:nowrap}
#toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">
  <div class="navbar"><span class="sync ok" id="sync"><i></i><span>ذخیره روی همین گوشی</span></span><span id="navaction"></span></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="بخش‌ها"><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 2.8v3.4M16 2.8v3.4M9 14.6l2 2 4-4"/></svg>امروز</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M5 20v-6M12 20V5M19 20v-10"/></svg>پیشرفت</button>
  <button data-tab="goals"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/></svg>هدف‌ها</button>
  <button data-tab="review"><svg viewBox="0 0 24 24"><path d="M6 3.5h9l3.5 3.5v13.5H6z"/><path d="M9.5 11h6M9.5 14.5h6M9.5 18h3.5"/></svg>مرور هفته</button>
</div></nav>

<div id="sheet" aria-hidden="true"></div>
<div id="toast" role="status"></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const FA = n => Number(n).toLocaleString('fa-IR');
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WD = ['ش','ی','د','س','چ','پ','ج']; // Saturday first
const WDF = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنج‌شنبه','جمعه'];
const COLORS = ['#3346d3','#0f9488','#e8710a','#d6336c','#7c4ddb','#2f9e44'];
const EMOJIS = ['🗣️','📚','🎯','💼','🧠','✍️','🏃','🧘','💻','🎧','📈','🌱','🎨','🧩','🔬','💡'];
let jLong, jShort, jDay;
try{
  jLong = new Intl.DateTimeFormat('fa-IR-u-ca-persian',{weekday:'long',day:'numeric',month:'long'});
  jShort = new Intl.DateTimeFormat('fa-IR-u-ca-persian',{day:'numeric',month:'short'});
  jDay = new Intl.DateTimeFormat('fa-IR-u-ca-persian',{day:'numeric'});
}catch(e){ jLong = jShort = jDay = {format:d=>d.toLocaleDateString()}; }
function today(){ const n=new Date(); return new Date(n.getFullYear(),n.getMonth(),n.getDate()); }
function key(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function parse(k){ const p=k.split('-').map(Number); return new Date(p[0],p[1]-1,p[2]); }
function addDays(d,n){ const x=new Date(d.getFullYear(),d.getMonth(),d.getDate()); x.setDate(x.getDate()+n); return x; }
function widx(d){ return (d.getDay()+1)%7; }
function weekStart(d){ return addDays(d,-widx(d)); }
const T0 = () => key(today());
const uid = () => 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clone = o => JSON.parse(JSON.stringify(o));
const CHEV = '<svg class="chev" viewBox="0 0 8 14"><path d="M7 1L1 7l6 6"/></svg>';
const FLAME = '<svg viewBox="0 0 24 24"><path d="M12 2c1 4-3 5.5-3 9.5A3 3 0 0 0 12 14c0-2 2-3 2-5 2.5 1.5 4 4 4 6.5A6 6 0 0 1 6 15.5C6 9.5 12 7 12 2z"/></svg>';
const CHECK = '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';

/* ---------- state ---------- */
function defaultState(){
  const t=T0();
  return {
    v:1, start:t, updated:0, ui:{},
    goals:[
      {id:'g1',name:'یادگیری مستمر زبان انگلیسی',icon:'🗣️',color:'#3346d3',created:t},
      {id:'g2',name:'مطالعه‌ی تخصصی حرفه‌ام',icon:'📚',color:'#0f9488',created:t}
    ],
    tasks:[
      {id:'t1',goalId:'g1',title:'مرور لغت‌ها با فلش‌کارت',minutes:15,created:t,sched:[{from:t,days:[0,1,2,3,4,5,6]}]},
      {id:'t2',goalId:'g1',title:'گوش دادن به پادکست یا ویدیوی انگلیسی',minutes:20,created:t,sched:[{from:t,days:[0,2,4]}]},
      {id:'t3',goalId:'g1',title:'نوشتن یا حرف زدن کوتاه به انگلیسی',minutes:15,created:t,sched:[{from:t,days:[1,3]}]},
      {id:'t4',goalId:'g2',title:'مطالعه‌ی کتاب یا مقاله‌ی تخصصی',minutes:30,created:t,sched:[{from:t,days:[0,1,2,3,4]}]},
      {id:'t5',goalId:'g2',title:'خلاصه‌نویسی آموخته‌های هفته',minutes:20,created:t,sched:[{from:t,days:[5]}]}
    ],
    log:{}, reviews:{}
  };
}
const LS='masir-state-v1';
function loadLocal(){ try{ const r=localStorage.getItem(LS); return r?JSON.parse(r):null; }catch(e){ return null; } }
function saveLocal(){ try{ localStorage.setItem(LS,JSON.stringify(S)); }catch(e){} }
function normalize(){ S.ui=S.ui||{}; S.reviews=S.reviews||{}; S.log=S.log||{}; }
let S = loadLocal() || defaultState(); normalize();

/* ---------- storage (on-device) ---------- */
function save(){ S.updated=Date.now(); saveLocal(); }
try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
/* ---------- model ---------- */
const goal = id => S.goals.find(g=>g.id===id);
const liveGoals = () => S.goals.filter(g=>!g.archived);
const liveTasks = gid => S.tasks.filter(t=>!t.archived && (!gid||t.goalId===gid));
function daysFor(t,k){ if(t.archived && k>=t.archived) return null; let c=null; for(const s of t.sched){ if(s.from<=k) c=s.days; } return c; }
function currentDays(t){ return daysFor(t,T0()) || t.sched[t.sched.length-1].days; }
function scheduled(k,gid){
  const w=widx(parse(k)), fut=k>T0();
  return S.tasks.filter(t=>{
    if(gid && t.goalId!==gid) return false;
    const g=goal(t.goalId); if(!g || (g.archived && k>=g.archived)) return false;
    const ds = fut ? (t.archived?null:currentDays(t)) : daysFor(t,k);
    return !!ds && ds.includes(w);
  });
}
const isDone = (k,id) => !!(S.log[k] && S.log[k][id]);
function dayStat(k,gid){ const ts=scheduled(k,gid); let done=0,min=0,plan=0; ts.forEach(t=>{ plan+=(+t.minutes||0); if(isDone(k,t.id)){ done++; min+=(+t.minutes||0); } }); return {total:ts.length,done,min,plan}; }
function rangeStat(fromD,days,gid){
  const t0=T0(); let total=0,done=0,min=0;
  for(let i=0;i<days;i++){ const k=key(addDays(fromD,i)); if(k<S.start||k>t0) continue; const s=dayStat(k,gid); total+=s.total; done+=s.done; min+=s.min; }
  return {total,done,min,pct: total? done/total : null};
}
function streak(gid){
  const t0=T0(); let d=today(), n=0;
  for(let i=0;i<1000;i++){ const k=key(d); if(k<S.start) break; const s=dayStat(k,gid); if(s.total>0){ if(s.done===s.total) n++; else if(k!==t0) break; } d=addDays(d,-1); }
  return n;
}
function bestStreak(){
  let d=parse(S.start), best=0, run=0; const t0=T0();
  for(let i=0;i<3000;i++){ const k=key(d); if(k>t0) break; const s=dayStat(k); if(s.total>0){ if(s.done===s.total){ run++; best=Math.max(best,run);} else if(k!==t0) run=0; } d=addDays(d,1); }
  return best;
}
const pctTxt = p => p==null ? '—' : FA(Math.round(p*100))+'٪';
const minTxt = m => m>=60 ? FA(Math.floor(m/60))+' ساعت'+(m%60?' و '+FA(m%60)+' دقیقه':'') : FA(m)+' دقیقه';

/* ---------- UI state ---------- */
const TABS=['today','progress','goals','review'];
let tab = TABS.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'today';
let cur = T0();
let rwk = key(weekStart(today()));
let popId = null;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2000); }

/* ---------- views ---------- */
function miniRing(p){ const r=15,c=2*Math.PI*r; return `<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="${r}" class="bgc"/>${p>0?`<circle cx="17" cy="17" r="${r}" class="fgc" stroke-dasharray="${c.toFixed(2)}" stroke-dashoffset="${(c*(1-p)).toFixed(2)}"/>`:''}</svg>`; }

function viewToday(){
  const t0=T0(), d=parse(cur), ws=weekStart(d), thisWs=key(weekStart(today()));
  const isToday=cur===t0, fut=cur>t0;
  const title = isToday ? 'امروز' : cur===key(addDays(today(),-1)) ? 'دیروز' : cur===key(addDays(today(),1)) ? 'فردا' : WDF[widx(d)];
  let h=`<h1 class="title">${title}</h1><div class="subtitle">${esc(jLong.format(d))}</div>`;

  const canPrev=key(ws)>key(weekStart(parse(S.start))), canNext=key(ws)<thisWs, showToday=key(ws)!==thisWs||!isToday;
  if(canPrev||canNext||showToday) h+=`<div class="weeknav"><button data-act="wprev" ${key(ws)<=key(weekStart(parse(S.start)))?'disabled':''}>هفته‌ی قبل</button>
      ${key(ws)!==thisWs||!isToday?`<button data-act="gotoday">برو به امروز</button>`:'<span></span>'}
      <button data-act="wnext" ${key(ws)>=thisWs?'disabled':''}>هفته‌ی بعد</button></div>`;
  h+=`<div class="week">`;
  for(let i=0;i<7;i++){
    const dd=addDays(ws,i), k=key(dd), s=dayStat(k), p=s.total?s.done/s.total:0;
    const cls=['wd']; if(k===cur) cls.push('sel'); if(k===t0) cls.push('today'); if(k>t0) cls.push('future'); if(k<S.start) cls.push('pre'); if(s.total&&p>=1&&k<=t0) cls.push('full');
    h+=`<button class="${cls.join(' ')}" data-act="day" data-k="${k}" aria-label="${esc(jLong.format(dd))}"><span class="l">${WD[i]}</span><span class="mr">${miniRing(k<=t0?p:0)}<span>${esc(jDay.format(dd))}</span></span></button>`;
  }
  h+=`</div>`;

  const st=dayStat(cur), p=st.total?st.done/st.total:0, sk=streak();
  if(!S.ui.welcomed){
    h+=`<div class="hint"><span>کارهای زیر پیشنهاد اولیه‌اند. از بخش «هدف‌ها» می‌توانی آن‌ها را با برنامه‌ی خودت عوض کنی.</span><button data-act="welcomed">باشه</button></div>`;
  }
  if(st.total){
    h+=`<div class="summary"><div class="sumtop"><span class="big">${fut?FA(st.total):FA(Math.round(p*100))+'٪'}</span><span class="of">${fut?'کار برنامه‌ریزی شده':`${FA(st.done)} از ${FA(st.total)} کار`}</span>
      ${sk>0&&!fut?`<span class="streak">${FLAME}${FA(sk)} روز پیاپی</span>`:''}</div>
      <div class="track"><i style="width:${fut?0:p*100}%"></i></div>
      <div class="sumrow"><span>${fut?'برای این روز':st.min?minTxt(st.min)+' تمرین':'هنوز شروع نشده'}</span><span>برنامه: ${minTxt(st.plan)}</span></div></div>`;
  }else{
    h+=`<div class="empty"><b>${cur<S.start?'قبل از شروع برنامه':'روز استراحت'}</b><span>${cur<S.start?'سابقه از روزی که شروع کردی ثبت می‌شود.':'برای این روز کاری تعریف نکرده‌ای.'}</span></div>`;
  }
  S.goals.forEach(g=>{
    const ts=scheduled(cur,g.id); if(!ts.length) return;
    const dn=ts.filter(t=>isDone(cur,t.id)).length;
    h+=`<div class="sec" style="--c:${g.color}"><span class="sw"></span>${esc(g.name)}<span class="end">${FA(dn)} از ${FA(ts.length)}</span></div><div class="group" style="--inset:54px">`;
    ts.forEach(t=>{
      const dn1=isDone(cur,t.id);
      h+=`<button class="rowi task ${dn1?'done':''} ${fut?'locked':''} ${popId===t.id?'pop':''}" style="--c:${g.color}" data-act="toggle" data-id="${t.id}" aria-pressed="${dn1}"><span class="chk">${CHECK}</span><span class="main"><span class="t">${esc(t.title)}</span></span><span class="val">${t.minutes?FA(t.minutes)+' دقیقه':''}</span></button>`;
    });
    h+=`</div>`;
  });
  popId=null;
  return h;
}

function viewProgress(){
  const ws=weekStart(today());
  const tw=rangeStat(ws,7), lw=rangeStat(addDays(ws,-7),7);
  let delta='<span class="delta">این هفته</span>';
  if(tw.pct!=null && lw.pct!=null){
    const df=Math.round((tw.pct-lw.pct)*100);
    delta = df>0?`<span class="delta up">${FA(df)}٪ بهتر از هفته‌ی قبل</span>`:df<0?`<span class="delta down">${FA(-df)}٪ کمتر از هفته‌ی قبل</span>`:`<span class="delta">مثل هفته‌ی قبل</span>`;
  }
  let h=`<h1 class="title">پیشرفت</h1><div class="subtitle">از ${esc(jShort.format(parse(S.start)))} تا امروز</div>`;
  h+=`<div class="statgrid">
    <div class="st"><small>انجام برنامه</small><b>${pctTxt(tw.pct)}</b>${delta}</div>
    <div class="st"><small>زمان این هفته</small><b>${FA(tw.min)}</b><em>دقیقه</em></div>
    <div class="st"><small>روزهای پیاپی</small><b>${FA(streak())}</b><em>روز</em></div>
    <div class="st"><small>بهترین رکورد</small><b>${FA(bestStreak())}</b><em>روز</em></div>
  </div>`;

  h+=`<div class="sec">درصد انجام برنامه در هشت هفته‌ی اخیر</div><div class="chart"><div class="bars">`;
  const labs=[];
  for(let i=7;i>=0;i--){
    const w=addDays(ws,-7*i), s=rangeStat(w,7), pv=s.pct==null?0:s.pct;
    h+=`<div class="bar ${i===0?'cur':''}"><span class="v">${s.pct==null?'':FA(Math.round(pv*100))}</span><div class="col" style="height:${s.pct==null?4:Math.max(4,pv*100)}%;${s.pct==null?'opacity:.4':''}"></div></div>`;
    labs.push(i===0?'این هفته':jShort.format(w));
  }
  h+=`</div><div class="xlab">${labs.map(l=>`<span>${esc(l)}</span>`).join('')}</div></div>`;

  h+=`<div class="sec">این هفته به تفکیک هدف</div><div class="group" style="--inset:62px">`;
  liveGoals().forEach(g=>{
    const s=rangeStat(ws,7,g.id), gs=streak(g.id);
    let dots='';
    for(let i=0;i<7;i++){ const k=key(addDays(ws,i)), ds=dayStat(k,g.id); let c=''; if(k>T0()||k<S.start||!ds.total) c='off'; else if(ds.done===ds.total) c='full'; else if(ds.done) c='part'; dots+=`<i class="${c}"></i>`; }
    h+=`<div class="rowi gp" style="--c:${g.color};align-items:flex-start;padding-top:14px;padding-bottom:14px"><span class="gbadge">${esc(g.icon)}</span><span class="main">
      <span class="row" style="display:flex;align-items:baseline;gap:8px"><span class="t" style="flex:1">${esc(g.name)}</span><b>${pctTxt(s.pct)}</b></span>
      <span class="s">${FA(s.done)} از ${FA(s.total)} کار، ${minTxt(s.min)}${gs?`، ${FA(gs)} روز پیاپی`:''}</span>
      <span class="dots7">${dots}</span></span></div>`;
  });
  h+=`</div>`;

  const start=addDays(ws,-77), t0=T0();
  h+=`<div class="sec">دوازده هفته‌ی اخیر</div><div class="heat"><div class="hlab">${WD.map(w=>`<span>${w}</span>`).join('')}</div><div class="hgrid">`;
  for(let i=0;i<84;i++){
    const dd=addDays(start,i), k=key(dd); let cls='hc';
    if(k>t0) cls+=' na'; else if(k<S.start) cls+=' pre'; else { const s=dayStat(k); if(s.total){ const p=s.done/s.total; cls+= p>=1?' l3':p>=.5?' l2':p>0?' l1':''; } }
    if(k===t0) cls+=' tdy';
    h+=`<div class="${cls}" title="${esc(jLong.format(dd))}"></div>`;
  }
  h+=`</div></div><div class="foot">هر خانه یک روز است؛ هرچه پررنگ‌تر، کارهای بیشتری از برنامه‌ی آن روز انجام شده.</div>`;
  return h;
}

function daysLine(days){ return `<span class="days">${WD.map((w,i)=>`<span class="${days.includes(i)?'on':''}">${w}</span>`).join('')}</span>`; }
function viewGoals(){
  let h=`<h1 class="title">هدف‌ها</h1><div class="subtitle">کارهای کوچک و مشخص، در روزهای ثابت</div>`;
  liveGoals().forEach(g=>{
    const ts=liveTasks(g.id), tot=ts.reduce((a,t)=>a+(+t.minutes||0)*currentDays(t).length,0);
    h+=`<div class="sec" style="--c:${g.color}"><span class="sw"></span>${FA(ts.length)} کار، ${minTxt(tot)} در هفته</div><div class="group">`;
    h+=`<button class="rowi" style="--c:${g.color}" data-act="editGoal" data-id="${g.id}"><span class="gbadge">${esc(g.icon)}</span><span class="main"><span class="t" style="font-weight:700">${esc(g.name)}</span></span>${CHEV}</button>`;
    ts.forEach(t=>{
      h+=`<button class="rowi" style="--c:${g.color};padding-inline-start:62px" data-act="editTask" data-id="${t.id}"><span class="main"><span class="t">${esc(t.title)}</span><span class="s">${t.minutes?FA(t.minutes)+' دقیقه':'بدون زمان'} ${daysLine(currentDays(t))}</span></span>${CHEV}</button>`;
    });
    h+=`<button class="rowi link" style="padding-inline-start:62px" data-act="newTask" data-g="${g.id}">افزودن کار</button></div>`;
  });
  h+=`<div class="group" style="margin-top:22px"><button class="rowi link" data-act="newGoal">افزودن هدف تازه</button></div>`;
  h+=`<div class="foot">کار خوب آن‌قدر کوچک است که در یک روز شلوغ هم انجامش بدهی. همیشه می‌شود بعداً بیشترش کرد.</div>`;
  h+=`<div class="sec">نسخه‌ی پشتیبان (هر چند وقت یک بار)</div><div class="group"><button class="rowi" data-act="backup"><span class="main"><span class="t">کپی کردن پشتیبان</span></span>${CHEV}</button><button class="rowi" data-act="restore"><span class="main"><span class="t">بازگردانی از پشتیبان</span></span>${CHEV}</button></div>`;
  return h;
}

function viewReview(){
  const ws=parse(rwk), thisWs=key(weekStart(today())), r=S.reviews[rwk]||{}, s=rangeStat(ws,7);
  let bestK=null,bestP=-1;
  for(let i=0;i<7;i++){ const k=key(addDays(ws,i)); if(k>T0()||k<S.start) continue; const d=dayStat(k); if(d.total){ const p=d.done/d.total; if(p>bestP){bestP=p;bestK=k;} } }
  let h=`<h1 class="title">مرور هفته</h1><div class="subtitle">پنج دقیقه در پایان هفته، برای هفته‌ی بهتر</div>`;
  h+=`<div class="seg"><button data-act="rprev" aria-label="هفته‌ی قبل" ${rwk<=key(weekStart(parse(S.start)))?'disabled':''}>›</button>
    <div class="mid"><b>${rwk===thisWs?'این هفته':'هفته‌ی '+esc(jShort.format(ws))}</b><small>${esc(jShort.format(ws))} تا ${esc(jShort.format(addDays(ws,6)))}</small></div>
    <button data-act="rnext" aria-label="هفته‌ی بعد" ${rwk>=thisWs?'disabled':''}>‹</button></div>`;
  h+=`<div class="sec">کارنامه</div><div class="group">
    <div class="rowi"><span class="main"><span class="t">انجام برنامه</span></span><span class="val"><b>${pctTxt(s.pct)}</b></span></div>
    <div class="rowi"><span class="main"><span class="t">کارهای انجام‌شده</span></span><span class="val"><b>${FA(s.done)}</b> از ${FA(s.total)}</span></div>
    <div class="rowi"><span class="main"><span class="t">زمان تمرین</span></span><span class="val"><b>${minTxt(s.min)}</b></span></div>
    ${bestK?`<div class="rowi"><span class="main"><span class="t">بهترین روز</span></span><span class="val"><b>${esc(WDF[widx(parse(bestK))])}</b></span></div>`:''}`;
  liveGoals().forEach(g=>{ const gs=rangeStat(ws,7,g.id);
    h+=`<div class="rowi gp" style="--c:${g.color}"><span class="main"><span style="display:flex;justify-content:space-between"><span class="t">${esc(g.name)}</span><span class="val"><b>${pctTxt(gs.pct)}</b></span></span><span class="track"><i style="width:${(gs.pct||0)*100}%"></i></span></span></div>`; });
  h+=`</div>`;
  h+=`<div class="sec">با خودت</div>
    <div class="qa"><label for="q1">چه چیزی خوب پیش رفت؟</label><textarea id="q1" data-rv="good" placeholder="مثلاً هر روز لغت مرور کردم">${esc(r.good)}</textarea></div>
    <div class="qa"><label for="q2">چه چیزی مانع شد؟</label><textarea id="q2" data-rv="block" placeholder="مثلاً شب‌ها خسته بودم و مطالعه عقب افتاد">${esc(r.block)}</textarea></div>
    <div class="qa"><label for="q3">هفته‌ی بعد چه چیزی را تغییر می‌دهم؟</label><textarea id="q3" data-rv="change" placeholder="مثلاً مطالعه را می‌برم به صبح، قبل از کار">${esc(r.change)}</textarea></div>
    <div class="foot">جواب‌ها همان لحظه ذخیره می‌شوند.</div>`;
  return h;
}

function render(){
  document.querySelectorAll('.tabs button').forEach(b=>{ const on=b.dataset.tab===tab; b.classList.toggle('on',on); b.setAttribute('aria-current',on?'page':'false'); });
  $('#navaction').innerHTML = tab==='goals' ? `<button class="navbtn" data-act="newGoal">هدف تازه</button>` : '';
  $('#view').innerHTML=({today:viewToday,progress:viewProgress,goals:viewGoals,review:viewReview})[tab]();
  document.querySelectorAll('.qa textarea').forEach(autoGrow);
}
function autoGrow(t){ t.style.height='auto'; t.style.height=Math.max(64,t.scrollHeight)+'px'; }

/* ---------- sheets ---------- */
const sheetOpen = () => $('#sheet').classList.contains('open');
function openSheet(html,onMount){
  const s=$('#sheet');
  s.innerHTML=`<div class="sheet-bg" data-act="closeSheet"></div><div class="sheet-panel" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  s.setAttribute('aria-hidden','false');
  requestAnimationFrame(()=>requestAnimationFrame(()=>s.classList.add('open')));
  if(onMount) onMount(s.querySelector('.sheet-panel'));
}
function closeSheet(){ const s=$('#sheet'); s.classList.remove('open'); s.setAttribute('aria-hidden','true'); setTimeout(()=>{ if(!s.classList.contains('open')) s.innerHTML=''; },330); }
function head(title,saveLabel){ return `<div class="sheethead"><button type="button" class="navbtn" data-act="closeSheet">انصراف</button><h3>${esc(title)}</h3>${saveLabel?`<button class="navbtn" id="savebtn" type="submit">${esc(saveLabel)}</button>`:'<span></span>'}</div>`; }
function confirmSheet(title,msg,okText,fn){
  openSheet(`<div class="alert"><b>${esc(title)}</b><p>${esc(msg)}</p><div class="group"><button class="rowi danger" id="okc">${esc(okText)}</button></div><div class="group" style="margin-top:8px"><button class="rowi" data-act="closeSheet" style="justify-content:center;color:var(--accent)">انصراف</button></div></div>`,
    p=>p.querySelector('#okc').onclick=()=>{ closeSheet(); fn(); });
}

function taskSheet(t,gid){
  const isNew=!t, days=isNew?[0,1,2,3,4]:currentDays(t).slice();
  let mins=t?(+t.minutes||0):20;
  openSheet(`<form id="tf" autocomplete="off">${head(isNew?'کار تازه':'ویرایش کار','ذخیره')}
    <div class="group"><div class="rowi fieldrow"><input class="input" name="title" required maxlength="80" value="${esc(t?t.title:'')}" placeholder="مثلاً ده صفحه کتاب تخصصی"></div></div>
    <div class="sec">جزئیات</div><div class="group">
      <label class="rowi fieldrow"><span class="lbl">هدف</span><span class="sp" style="flex:1"></span><select name="goal">${liveGoals().map(g=>`<option value="${g.id}" ${(t?t.goalId:gid)===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select></label>
      <div class="rowi fieldrow"><span class="lbl">مدت (دقیقه)</span><span style="flex:1"></span><span class="stepper"><button type="button" data-step="-5" aria-label="کم کردن">−</button><input type="number" name="min" min="0" max="600" inputmode="numeric" value="${mins}"><button type="button" data-step="5" aria-label="زیاد کردن">+</button></span></div>
    </div>
    <div class="sec">روزهای هفته</div><div class="group"><div class="daypick">${WD.map((w,i)=>`<button type="button" data-d="${i}" class="${days.includes(i)?'on':''}" aria-label="${WDF[i]}">${w}</button>`).join('')}</div>
      <div class="chips"><button type="button" data-q="all">هر روز</button><button type="button" data-q="work">شنبه تا چهارشنبه</button><button type="button" data-q="alt">یک روز در میان</button></div></div>
    ${isNew?'':'<div class="group" style="margin-top:22px"><button type="button" class="rowi danger" id="del">حذف این کار</button></div>'}
  </form>`, p=>{
    const sel=new Set(days), f=p.querySelector('#tf');
    const paint=()=>p.querySelectorAll('.daypick button').forEach(b=>b.classList.toggle('on',sel.has(+b.dataset.d)));
    p.querySelectorAll('.daypick button').forEach(b=>b.onclick=()=>{ const d=+b.dataset.d; sel.has(d)?sel.delete(d):sel.add(d); paint(); });
    p.querySelectorAll('.chips button').forEach(b=>b.onclick=()=>{ sel.clear(); ({all:[0,1,2,3,4,5,6],work:[0,1,2,3,4],alt:[0,2,4]})[b.dataset.q].forEach(d=>sel.add(d)); paint(); });
    p.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{ f.min.value=Math.max(0,Math.min(600,(parseInt(f.min.value,10)||0)+(+b.dataset.step))); });
    if(isNew) setTimeout(()=>f.title.focus(),350);
    const del=p.querySelector('#del');
    if(del) del.onclick=()=>confirmSheet('حذف این کار؟','سابقه‌ی روزهای گذشته حفظ می‌شود.','حذف کار',()=>{
      const t0=T0(); if(t.created===t0) S.tasks=S.tasks.filter(x=>x.id!==t.id); else t.archived=t0;
      save(); render(); toast('کار حذف شد');
    });
    f.onsubmit=e=>{
      e.preventDefault();
      const title=f.title.value.trim(); if(!title){ f.title.focus(); return; }
      const dl=[...sel].sort((a,b)=>a-b); if(!dl.length){ toast('دست‌کم یک روز را انتخاب کن'); return; }
      const m=Math.max(0,Math.min(600,parseInt(f.min.value,10)||0)), t0=T0();
      if(isNew) S.tasks.push({id:uid(),goalId:f.goal.value,title,minutes:m,created:t0,sched:[{from:t0,days:dl}]});
      else{
        t.title=title; t.minutes=m; t.goalId=f.goal.value;
        if(JSON.stringify(currentDays(t))!==JSON.stringify(dl)){ const last=t.sched[t.sched.length-1]; if(last.from>=t0) last.days=dl; else t.sched.push({from:t0,days:dl}); }
      }
      S.ui.welcomed=true; save(); closeSheet(); render(); toast(isNew?'کار اضافه شد':'تغییرات ذخیره شد');
    };
  });
}

function goalSheet(g){
  const isNew=!g; let color=g?g.color:COLORS[S.goals.length%COLORS.length]; let icon=g?g.icon:'🎯';
  openSheet(`<form id="gf" autocomplete="off">${head(isNew?'هدف تازه':'ویرایش هدف','ذخیره')}
    <div class="group"><div class="rowi fieldrow"><input class="input" name="name" required maxlength="60" value="${esc(g?g.name:'')}" placeholder="مثلاً ورزش منظم"></div></div>
    <div class="sec">رنگ</div><div class="group"><div class="swatches">${COLORS.map(c=>`<button type="button" data-c="${c}" style="background:${c};--c:${c}" class="${c===color?'on':''}" aria-label="رنگ"></button>`).join('')}</div></div>
    <div class="sec">نماد</div><div class="group"><div class="emojis">${EMOJIS.map(e=>`<button type="button" data-e="${e}" class="${e===icon?'on':''}">${e}</button>`).join('')}</div></div>
    ${isNew?'':'<div class="group" style="margin-top:22px"><button type="button" class="rowi danger" id="del">حذف این هدف</button></div>'}
  </form>`, p=>{
    p.querySelectorAll('.swatches button').forEach(b=>b.onclick=()=>{ color=b.dataset.c; p.querySelectorAll('.swatches button').forEach(x=>x.classList.toggle('on',x===b)); });
    p.querySelectorAll('.emojis button').forEach(b=>b.onclick=()=>{ icon=b.dataset.e; p.querySelectorAll('.emojis button').forEach(x=>x.classList.toggle('on',x===b)); });
    const f=p.querySelector('#gf'); if(isNew) setTimeout(()=>f.name.focus(),350);
    const del=p.querySelector('#del');
    if(del) del.onclick=()=>confirmSheet('حذف این هدف؟','کارهای این هدف هم کنار می‌روند. سابقه‌ی گذشته حفظ می‌شود.','حذف هدف',()=>{
      const t0=T0();
      if(g.created===t0){ S.goals=S.goals.filter(x=>x.id!==g.id); S.tasks=S.tasks.filter(x=>x.goalId!==g.id); }
      else { g.archived=t0; S.tasks.forEach(x=>{ if(x.goalId===g.id&&!x.archived) x.archived=t0; }); }
      save(); render(); toast('هدف حذف شد');
    });
    f.onsubmit=e=>{
      e.preventDefault(); const name=f.name.value.trim(); if(!name){ f.name.focus(); return; }
      if(isNew) S.goals.push({id:uid(),name,icon,color,created:T0()}); else { g.name=name; g.icon=icon; g.color=color; }
      save(); closeSheet(); render(); toast(isNew?'هدف اضافه شد':'تغییرات ذخیره شد');
    };
  });
}

function backup(){
  const txt=JSON.stringify(S);
  const show=()=>openSheet(`${head('متن پشتیبان','')}<textarea class="mono" readonly>${esc(txt)}</textarea><div class="foot">این متن را کامل کپی کن و جایی امن نگه دار.</div>`,p=>{ const ta=p.querySelector('textarea'); ta.focus(); ta.select(); });
  try{ navigator.clipboard.writeText(txt).then(()=>toast('پشتیبان کپی شد'),show); }catch(e){ show(); }
}
function restore(){
  openSheet(`<form id="rf">${head('بازگردانی','بازگردانی')}<textarea class="mono" id="rt" placeholder="متن پشتیبان را اینجا بچسبان"></textarea><div class="foot">داده‌های فعلی با محتوای پشتیبان جایگزین می‌شوند.</div></form>`,p=>{
    p.querySelector('#rf').onsubmit=e=>{
      e.preventDefault();
      try{
        const o=JSON.parse(p.querySelector('#rt').value);
        if(!Array.isArray(o.goals)||!Array.isArray(o.tasks)||typeof o.log!=='object'||!o.start) throw 0;
        S=o; normalize(); save(); closeSheet(); render(); toast('بازگردانی انجام شد');
      }catch(_){ toast('این متن، پشتیبان معتبر نیست'); }
    };
  });
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');
  if(tb){ tab=tb.dataset.tab; try{ history.replaceState(null,'','#'+tab); }catch(_){} render(); window.scrollTo(0,0); return; }
  const a=e.target.closest('[data-act]'); if(!a) return;
  switch(a.dataset.act){
    case 'toggle':{
      if(cur>T0()){ toast('این روز هنوز نرسیده'); break; }
      const id=a.dataset.id; S.log[cur]=S.log[cur]||{};
      const now=!S.log[cur][id];
      if(now) S.log[cur][id]=1; else delete S.log[cur][id];
      if(!Object.keys(S.log[cur]).length) delete S.log[cur];
      if(now) popId=id;
      save(); render();
      const st=dayStat(cur);
      if(now && st.total && st.done===st.total) toast(cur===T0()?'برنامه‌ی امروز کامل شد':'برنامه‌ی این روز کامل شد');
      break;}
    case 'day': cur=a.dataset.k; render(); break;
    case 'wprev': cur=key(addDays(weekStart(parse(cur)),-1)); if(cur<S.start) cur=S.start; render(); break;
    case 'wnext': { const n=addDays(weekStart(parse(cur)),7); cur = key(weekStart(today()))===key(n) ? T0() : key(n); render(); break; }
    case 'gotoday': cur=T0(); render(); break;
    case 'welcomed': S.ui.welcomed=true; save(); render(); break;
    case 'rprev': rwk=key(addDays(parse(rwk),-7)); render(); break;
    case 'rnext': rwk=key(addDays(parse(rwk),7)); render(); break;
    case 'newTask': taskSheet(null,a.dataset.g); break;
    case 'editTask': taskSheet(S.tasks.find(t=>t.id===a.dataset.id)); break;
    case 'newGoal': goalSheet(null); break;
    case 'editGoal': goalSheet(goal(a.dataset.id)); break;
    case 'backup': backup(); break;
    case 'restore': restore(); break;
    case 'closeSheet': closeSheet(); break;
  }
});
let rvTimer=null;
document.addEventListener('input',e=>{
  const f=e.target.dataset&&e.target.dataset.rv; if(!f) return;
  autoGrow(e.target);
  S.reviews[rwk]=S.reviews[rwk]||{}; S.reviews[rwk][f]=e.target.value;
  clearTimeout(rvTimer); rvTimer=setTimeout(save,700);
});
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&sheetOpen()) closeSheet(); });
window.addEventListener('hashchange',()=>{ const h=location.hash.slice(1); if(TABS.includes(h)&&h!==tab){ tab=h; render(); } });
let lastDay=T0();
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && T0()!==lastDay){ if(cur===lastDay) cur=T0(); lastDay=T0(); rwk=key(weekStart(today())); if(!sheetOpen()) render(); } });

render();
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
})();
</script>
</body>
</html>
